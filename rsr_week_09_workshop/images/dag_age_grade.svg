<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Age (exposure) -->
  <rect x="40" y="170" width="160" height="60" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="120" y="207" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">Age</text>

  <!-- Grade (mediator) -->
  <rect x="270" y="40" width="180" height="70" rx="10" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
  <text x="360" y="72" text-anchor="middle" font-size="17" font-weight="bold" fill="#6b21a8">Grade</text>
  <text x="360" y="94" text-anchor="middle" font-size="13" fill="#6b21a8">mediator</text>

  <!-- Depression (outcome) -->
  <rect x="520" y="170" width="160" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="207" text-anchor="middle" font-size="17" font-weight="bold" fill="#166534">Depression</text>

  <!-- Age -> Grade -->
  <path d="M 180 175 L 290 110" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Grade -> Depression -->
  <path d="M 430 110 L 540 175" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Age -> Depression (direct) -->
  <path d="M 200 200 L 520 200" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="360" y="255" text-anchor="middle" font-size="13" fill="#475569">Controlling for grade blocks the Age -&gt; Grade -&gt; Depression path</text>
</svg>
