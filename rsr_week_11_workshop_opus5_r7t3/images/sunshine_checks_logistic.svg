<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="712" viewBox="0 0 1600 712" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1600" height="712" fill="#ffffff"/>

  <text x="800" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#12202b">SUNSHINE checks for logistic regression</text>
  <text x="800" y="80" text-anchor="middle" font-size="18" fill="#5d7475">Highlighted rows can be inspected with performance::check_model()</text>

  <!-- header -->
  <g>
    <rect x="48"   y="100" width="128" height="52" rx="10" fill="#0f766e"/>
    <rect x="190"  y="100" width="470" height="52" rx="10" fill="#0f766e"/>
    <rect x="674"  y="100" width="576" height="52" rx="10" fill="#0f766e"/>
    <rect x="1264" y="100" width="288" height="52" rx="10" fill="#0f766e"/>
    <text x="112"  y="133" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Letter</text>
    <text x="425"  y="133" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Check</text>
    <text x="962"  y="133" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Question it asks</text>
    <text x="1408" y="133" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">How</text>
  </g>

  <!-- row 1: S sample size -->
  <g>
    <rect x="48"   y="164" width="128" height="52" rx="10" fill="#eef2f6"/>
    <rect x="190"  y="164" width="470" height="52" rx="10" fill="#eef2f6"/>
    <rect x="674"  y="164" width="576" height="52" rx="10" fill="#eef2f6"/>
    <rect x="1264" y="164" width="288" height="52" rx="10" fill="#eef2f6"/>
    <text x="112"  y="197" text-anchor="middle" font-size="19" font-weight="700" fill="#42565f">S</text>
    <text x="425"  y="197" text-anchor="middle" font-size="18" fill="#42565f">Sample size</text>
    <text x="962"  y="197" text-anchor="middle" font-size="18" fill="#42565f">At least 10 events per parameter?</text>
    <text x="1408" y="197" text-anchor="middle" font-size="18" fill="#8496a0">Count events vs p</text>
  </g>

  <!-- row 2: U uncorrelated -->
  <g>
    <rect x="48"   y="226" width="128" height="52" rx="10" fill="#eef2f6"/>
    <rect x="190"  y="226" width="470" height="52" rx="10" fill="#eef2f6"/>
    <rect x="674"  y="226" width="576" height="52" rx="10" fill="#eef2f6"/>
    <rect x="1264" y="226" width="288" height="52" rx="10" fill="#eef2f6"/>
    <text x="112"  y="259" text-anchor="middle" font-size="19" font-weight="700" fill="#42565f">U</text>
    <text x="425"  y="259" text-anchor="middle" font-size="18" fill="#42565f">Uncorrelated errors</text>
    <text x="962"  y="259" text-anchor="middle" font-size="18" fill="#42565f">Observations independent?</text>
    <text x="1408" y="259" text-anchor="middle" font-size="18" fill="#8496a0">Study design</text>
  </g>

  <!-- row 3: N multicollinearity -->
  <g>
    <rect x="48"   y="288" width="128" height="52" rx="10" fill="#c9f2e6" stroke="#0f766e" stroke-width="2"/>
    <rect x="190"  y="288" width="470" height="52" rx="10" fill="#c9f2e6" stroke="#0f766e" stroke-width="2"/>
    <rect x="674"  y="288" width="576" height="52" rx="10" fill="#c9f2e6" stroke="#0f766e" stroke-width="2"/>
    <rect x="1264" y="288" width="288" height="52" rx="10" fill="#c9f2e6" stroke="#0f766e" stroke-width="2"/>
    <text x="112"  y="321" text-anchor="middle" font-size="19" font-weight="700" fill="#0b5d55">N</text>
    <text x="425"  y="321" text-anchor="middle" font-size="18" font-weight="700" fill="#0b5d55">No multicollinearity</text>
    <text x="962"  y="321" text-anchor="middle" font-size="18" fill="#0b5d55">Predictors too correlated?</text>
    <text x="1408" y="321" text-anchor="middle" font-size="18" font-weight="700" fill="#0b5d55">check_model()</text>
  </g>

  <!-- row 4: S shape -->
  <g>
    <rect x="48"   y="350" width="128" height="52" rx="10" fill="#c9f2e6" stroke="#0f766e" stroke-width="2"/>
    <rect x="190"  y="350" width="470" height="52" rx="10" fill="#c9f2e6" stroke="#0f766e" stroke-width="2"/>
    <rect x="674"  y="350" width="576" height="52" rx="10" fill="#c9f2e6" stroke="#0f766e" stroke-width="2"/>
    <rect x="1264" y="350" width="288" height="52" rx="10" fill="#c9f2e6" stroke="#0f766e" stroke-width="2"/>
    <text x="112"  y="383" text-anchor="middle" font-size="19" font-weight="700" fill="#0b5d55">S</text>
    <text x="425"  y="383" text-anchor="middle" font-size="18" font-weight="700" fill="#0b5d55">Shape (linear in the log odds)</text>
    <text x="962"  y="383" text-anchor="middle" font-size="18" fill="#0b5d55">Log odds a straight line in each continuous predictor?</text>
    <text x="1408" y="383" text-anchor="middle" font-size="18" font-weight="700" fill="#0b5d55">check_model()</text>
  </g>

  <!-- row 5: H homogeneity - not applicable -->
  <g>
    <rect x="48"   y="412" width="128" height="52" rx="10" fill="#fbeceb" stroke="#c98a86" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="190"  y="412" width="470" height="52" rx="10" fill="#fbeceb" stroke="#c98a86" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="674"  y="412" width="576" height="52" rx="10" fill="#fbeceb" stroke="#c98a86" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="1264" y="412" width="288" height="52" rx="10" fill="#fbeceb" stroke="#c98a86" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="112"  y="445" text-anchor="middle" font-size="19" font-weight="700" fill="#a04b46">H</text>
    <text x="425"  y="445" text-anchor="middle" font-size="18" fill="#a04b46">Homogeneity of variance</text>
    <text x="962"  y="445" text-anchor="middle" font-size="18" fill="#a04b46">Does not apply: variance is fixed by the mean</text>
    <text x="1408" y="445" text-anchor="middle" font-size="18" fill="#a04b46">Nothing to check</text>
  </g>

  <!-- row 6: I influential -->
  <g>
    <rect x="48"   y="474" width="128" height="52" rx="10" fill="#c9f2e6" stroke="#0f766e" stroke-width="2"/>
    <rect x="190"  y="474" width="470" height="52" rx="10" fill="#c9f2e6" stroke="#0f766e" stroke-width="2"/>
    <rect x="674"  y="474" width="576" height="52" rx="10" fill="#c9f2e6" stroke="#0f766e" stroke-width="2"/>
    <rect x="1264" y="474" width="288" height="52" rx="10" fill="#c9f2e6" stroke="#0f766e" stroke-width="2"/>
    <text x="112"  y="507" text-anchor="middle" font-size="19" font-weight="700" fill="#0b5d55">I</text>
    <text x="425"  y="507" text-anchor="middle" font-size="18" font-weight="700" fill="#0b5d55">Influential points</text>
    <text x="962"  y="507" text-anchor="middle" font-size="18" fill="#0b5d55">One point pulling too hard?</text>
    <text x="1408" y="507" text-anchor="middle" font-size="18" font-weight="700" fill="#0b5d55">check_model()</text>
  </g>

  <!-- row 7: N normality - replaced -->
  <g>
    <rect x="48"   y="536" width="128" height="52" rx="10" fill="#fbeceb" stroke="#c98a86" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="190"  y="536" width="470" height="52" rx="10" fill="#fbeceb" stroke="#c98a86" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="674"  y="536" width="576" height="52" rx="10" fill="#fbeceb" stroke="#c98a86" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="1264" y="536" width="288" height="52" rx="10" fill="#fbeceb" stroke="#c98a86" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="112"  y="569" text-anchor="middle" font-size="19" font-weight="700" fill="#a04b46">N</text>
    <text x="425"  y="569" text-anchor="middle" font-size="18" fill="#a04b46">Normality of residuals</text>
    <text x="962"  y="569" text-anchor="middle" font-size="18" fill="#a04b46">Does not apply: replaced by uniform quantile residuals</text>
    <text x="1408" y="569" text-anchor="middle" font-size="18" fill="#a04b46">check_residuals()</text>
  </g>

  <!-- row 8: E exogeneity -->
  <g>
    <rect x="48"   y="598" width="128" height="52" rx="10" fill="#eef2f6"/>
    <rect x="190"  y="598" width="470" height="52" rx="10" fill="#eef2f6"/>
    <rect x="674"  y="598" width="576" height="52" rx="10" fill="#eef2f6"/>
    <rect x="1264" y="598" width="288" height="52" rx="10" fill="#eef2f6"/>
    <text x="112"  y="631" text-anchor="middle" font-size="19" font-weight="700" fill="#42565f">E</text>
    <text x="425"  y="631" text-anchor="middle" font-size="18" fill="#42565f">Exogeneity</text>
    <text x="962"  y="631" text-anchor="middle" font-size="18" fill="#42565f">Predictor independent of the error?</text>
    <text x="1408" y="631" text-anchor="middle" font-size="18" fill="#8496a0">Domain knowledge</text>
  </g>

  <text x="48" y="688" font-size="17" fill="#5d7475">Dashed red rows are the two linear-regression checks that carry no meaning for a logistic model.</text>
</svg>
