<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #25344b; }
    .title { font-size: 31px; font-weight: 700; }
    .subtitle { font-size: 18px; }
    .head { font-size: 20px; font-weight: 700; fill: white; }
    .cell { font-size: 18px; }
    .letter { font-size: 22px; font-weight: 700; }
    .yes { fill: #c9f3ec; stroke: #00877b; stroke-width: 3; }
    .design { fill: #eef2f6; stroke: #bbc6d2; stroke-width: 2; }
    .no { fill: #fff0d8; stroke: #e09f28; stroke-width: 3; }
    .header { fill: #087d73; }
    .note { font-size: 15px; font-style: italic; }
  </style>
  <text x="750" y="45" text-anchor="middle" class="title">SUNSHINE checks adapted for binary logistic regression</text>
  <text x="750" y="75" text-anchor="middle" class="subtitle">Green rows are useful model checks; grey rows depend mainly on study design; amber rows are not logistic assumptions.</text>

  <rect x="35" y="105" width="110" height="50" rx="9" class="header"/>
  <rect x="160" y="105" width="390" height="50" rx="9" class="header"/>
  <rect x="565" y="105" width="600" height="50" rx="9" class="header"/>
  <rect x="1180" y="105" width="285" height="50" rx="9" class="header"/>
  <text x="90" y="138" text-anchor="middle" class="head">Letter</text>
  <text x="355" y="138" text-anchor="middle" class="head">Check</text>
  <text x="865" y="138" text-anchor="middle" class="head">Question it asks</text>
  <text x="1322" y="138" text-anchor="middle" class="head">How</text>

  <g transform="translate(0,170)">
    <rect x="35" y="0" width="110" height="62" rx="8" class="yes"/><rect x="160" y="0" width="390" height="62" rx="8" class="yes"/><rect x="565" y="0" width="600" height="62" rx="8" class="yes"/><rect x="1180" y="0" width="285" height="62" rx="8" class="yes"/>
    <text x="90" y="39" text-anchor="middle" class="letter">S</text><text x="355" y="39" text-anchor="middle" class="cell">Sample size</text><text x="865" y="39" text-anchor="middle" class="cell">Enough outcomes and non-outcomes per parameter?</text><text x="1322" y="39" text-anchor="middle" class="cell">Count events and parameters</text>
  </g>
  <g transform="translate(0,242)">
    <rect x="35" y="0" width="110" height="62" rx="8" class="design"/><rect x="160" y="0" width="390" height="62" rx="8" class="design"/><rect x="565" y="0" width="600" height="62" rx="8" class="design"/><rect x="1180" y="0" width="285" height="62" rx="8" class="design"/>
    <text x="90" y="39" text-anchor="middle" class="letter">U</text><text x="355" y="39" text-anchor="middle" class="cell">Uncorrelated observations</text><text x="865" y="39" text-anchor="middle" class="cell">Are patients independent, or clustered/repeated?</text><text x="1322" y="39" text-anchor="middle" class="cell">Study design</text>
  </g>
  <g transform="translate(0,314)">
    <rect x="35" y="0" width="110" height="62" rx="8" class="yes"/><rect x="160" y="0" width="390" height="62" rx="8" class="yes"/><rect x="565" y="0" width="600" height="62" rx="8" class="yes"/><rect x="1180" y="0" width="285" height="62" rx="8" class="yes"/>
    <text x="90" y="39" text-anchor="middle" class="letter">N</text><text x="355" y="39" text-anchor="middle" class="cell">No multicollinearity</text><text x="865" y="39" text-anchor="middle" class="cell">Are predictors carrying nearly the same information?</text><text x="1322" y="39" text-anchor="middle" class="cell">VIF / check_model()</text>
  </g>
  <g transform="translate(0,386)">
    <rect x="35" y="0" width="110" height="62" rx="8" class="yes"/><rect x="160" y="0" width="390" height="62" rx="8" class="yes"/><rect x="565" y="0" width="600" height="62" rx="8" class="yes"/><rect x="1180" y="0" width="285" height="62" rx="8" class="yes"/>
    <text x="90" y="39" text-anchor="middle" class="letter">S</text><text x="355" y="39" text-anchor="middle" class="cell">Shape on the log-odds scale</text><text x="865" y="39" text-anchor="middle" class="cell">Are continuous effects linear in log odds?</text><text x="1322" y="39" text-anchor="middle" class="cell">Plots, binned residuals, AIC</text>
  </g>
  <g transform="translate(0,458)">
    <rect x="35" y="0" width="110" height="62" rx="8" class="no"/><rect x="160" y="0" width="390" height="62" rx="8" class="no"/><rect x="565" y="0" width="600" height="62" rx="8" class="no"/><rect x="1180" y="0" width="285" height="62" rx="8" class="no"/>
    <text x="90" y="39" text-anchor="middle" class="letter">H</text><text x="355" y="39" text-anchor="middle" class="cell">Homogeneous residual variance</text><text x="865" y="31" text-anchor="middle" class="cell">Not assumed: Bernoulli variance is p(1 − p)</text><text x="1322" y="39" text-anchor="middle" class="cell">Do not apply the LM check</text>
  </g>
  <g transform="translate(0,530)">
    <rect x="35" y="0" width="110" height="62" rx="8" class="yes"/><rect x="160" y="0" width="390" height="62" rx="8" class="yes"/><rect x="565" y="0" width="600" height="62" rx="8" class="yes"/><rect x="1180" y="0" width="285" height="62" rx="8" class="yes"/>
    <text x="90" y="39" text-anchor="middle" class="letter">I</text><text x="355" y="39" text-anchor="middle" class="cell">Influential observations</text><text x="865" y="39" text-anchor="middle" class="cell">Is one patient pulling the estimates too strongly?</text><text x="1322" y="39" text-anchor="middle" class="cell">Cook's distance / check_model()</text>
  </g>
  <g transform="translate(0,602)">
    <rect x="35" y="0" width="110" height="62" rx="8" class="no"/><rect x="160" y="0" width="390" height="62" rx="8" class="no"/><rect x="565" y="0" width="600" height="62" rx="8" class="no"/><rect x="1180" y="0" width="285" height="62" rx="8" class="no"/>
    <text x="90" y="39" text-anchor="middle" class="letter">N</text><text x="355" y="39" text-anchor="middle" class="cell">Normally distributed residuals</text><text x="865" y="31" text-anchor="middle" class="cell">Not assumed for a binary logistic model</text><text x="1322" y="39" text-anchor="middle" class="cell">Do not interpret as an LM check</text>
  </g>
  <g transform="translate(0,674)">
    <rect x="35" y="0" width="110" height="62" rx="8" class="design"/><rect x="160" y="0" width="390" height="62" rx="8" class="design"/><rect x="565" y="0" width="600" height="62" rx="8" class="design"/><rect x="1180" y="0" width="285" height="62" rx="8" class="design"/>
    <text x="90" y="39" text-anchor="middle" class="letter">E</text><text x="355" y="39" text-anchor="middle" class="cell">Exogeneity / specification</text><text x="865" y="31" text-anchor="middle" class="cell">Are important confounders omitted or measured badly?</text><text x="1322" y="39" text-anchor="middle" class="cell">Design and domain knowledge</text>
  </g>

  <text x="35" y="775" class="note">A binned-residual pattern can flag overall misfit, but it does not identify the cause by itself. Possible causes include non-linear effects, interactions, omitted predictors, sparse data, or influential observations.</text>
  <text x="35" y="807" class="note">For logistic regression, “linear” means linear in the log odds for each continuous predictor, conditional on the other predictors. The probability curve need not be straight.</text>
</svg>
